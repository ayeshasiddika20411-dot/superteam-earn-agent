name: Superteam Autonomous Bounty Hunter

on:
  schedule:
    # প্রতি ২০ মিনিট পর পর স্বয়ংক্রিয়ভাবে ক্লাউডে রান হবে
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install -g tsx

      - name: 🚀 Run Autonomous Superteam Bounty Scanner
        env:
          SUPERTEAM_BASE_URL: https://superteam.fun
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HANDLE: ${{ secrets.TELEGRAM_HANDLE }}
        run: tsx src/index.ts
